# =========================
# CI Pipeline
# =========================
kind: pipeline
type: kubernetes
name: ci

trigger:
  event: [push, pull_request]
  branch: [main]

node_selector:
  node-role: drone
tolerations:
  - key: dedicated
    value: drone
    effect: NoSchedule

steps:
  # 本番用のイメージはまだないので、lint とビルドが通ることだけを確認する。
  # シークレットは参照しない。
  - name: build
    image: node:26-bookworm-slim
    commands:
      - npm ci
      - npm run lint
      - npm run build
